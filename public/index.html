<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcane – the all-in-one Yapper bot</title>
<link rel="icon" href="/arcane.png">
<style>
:root{--bg:#070d1a;--card:#0e1a2e;--line:#1b2c47;--tx:#e8f3fb;--mut:#8aa3ba;--ac:#74c9f4;--ac2:#4aa8e0;--ok:#2ecc71}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 70% -10%,#12335a55,transparent),var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}nav{display:flex;align-items:center;gap:22px;padding:14px 5vw;position:sticky;top:0;background:#070d1acc;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-right:auto}.logo img,.logo svg{width:34px;height:34px;border-radius:50%}
nav a.l{color:var(--mut);font-weight:600}nav a.l:hover,nav a.on{color:var(--ac)}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#05121f;font-weight:700;padding:10px 20px;border-radius:10px;border:0;cursor:pointer;font-size:15px}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--line)}.btn:hover{filter:brightness(1.1)}
main{max-width:1100px;margin:auto;padding:40px 5vw 80px}.hero{text-align:center;padding:60px 0 30px}
.hero img,.hero svg.big{width:130px;height:130px;border-radius:50%;box-shadow:0 0 70px #74c9f488}
h1{font-size:clamp(36px,6vw,64px);margin:18px 0 8px;line-height:1.05}h1 span{color:var(--ac)}.hero p{color:var(--mut);max-width:560px;margin:0 auto 26px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;transition:.2s}.card:hover{border-color:var(--ac);transform:translateY(-3px)}
.card h3{margin:0 0 6px;color:var(--ac)}.card p{margin:0;color:var(--mut);font-size:14px}
input,select,textarea{width:100%;background:#0a1425;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--mut);cursor:pointer}.chip.on{background:var(--ac);color:#05121f;border-color:var(--ac);font-weight:700}
.cmd{display:flex;gap:12px;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line)}.cmd b{color:var(--ac);min-width:130px}.cmd span{color:var(--mut);font-size:14px}.tag{font-size:11px;background:#74c9f422;color:var(--ac);padding:2px 8px;border-radius:6px;margin-left:auto}
.dash{display:grid;grid-template-columns:230px 1fr;gap:24px}@media(max-width:760px){.dash{grid-template-columns:1fr}}
.side button{display:block;width:100%;text-align:left;padding:11px 14px;margin-bottom:6px;border-radius:10px;border:0;background:none;color:var(--mut);font:600 15px inherit;cursor:pointer}.side button.on,.side button:hover{background:#74c9f41c;color:var(--ac)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.row small{display:block;color:var(--mut)}.row>div:last-child{min-width:200px}
.sw{appearance:none;width:44px!important;height:24px;border-radius:99px;background:#22344f;position:relative;cursor:pointer;padding:0;border:0}.sw:checked{background:var(--ac)}.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw:checked:after{left:23px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ok);color:#04210f;padding:12px 18px;border-radius:10px;font-weight:700;opacity:0;transition:.3s}.toast.s{opacity:1}
.prev{background:#0a1425;border-left:4px solid var(--ac);border-radius:8px;padding:14px;margin-top:10px}
</style></head><body>
<nav><a class="logo" href="#/"><span id="lg"></span>Arcane</a><a class="l" href="#/commands">Commands</a><a class="l" href="#/dashboard">Dashboard</a><a class="btn" id="inv" href="https://www.yapin.gg/">Add to Yapper</a></nav>
<main id="app"></main><div class="toast" id="toast">Saved – live in the bot within 15s</div>
<script>
// Logo: put your bot pfp at /public/arcane.png. If missing, this light-blue emblem shows instead.
const SVG='<svg viewBox="0 0 100 100" class="big"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fe0ff"/><stop offset="1" stop-color="#3a9ad9"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="#0e2a4a"/><path d="M50 18 78 74H64L50 44 36 74H22Z" fill="url(#g)"/><circle cx="50" cy="66" r="6" fill="#d8f3ff"/></svg>';
const logo=(c='')=>{const i=new Image();i.src='/arcane.png';i.className=c;i.onerror=()=>{i.replaceWith(Object.assign(document.createElement('span'),{innerHTML:SVG.replace('class="big"',c?'class="big"':'')}).firstChild)};return i};
document.getElementById('lg').append(logo());
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d};const app=document.getElementById('app');
const api=async(p,o)=>{const r=await fetch('/api/'+p,o);if(!r.ok)throw r.status;return r.json()};
const put=(p,b)=>api(p,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(b)});
const toast=()=>{const t=document.getElementById('toast');t.classList.add('s');setTimeout(()=>t.classList.remove('s'),2200)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function home(){app.innerHTML=`<div class="hero" id="h"><h1>Meet <span>Arcane</span></h1><p>Moderation, automod, leveling, economy, welcome cards and more – configured from a clean dashboard and live on Yapper instantly.</p><a class="btn" href="#/dashboard">Open Dashboard</a> <a class="btn g" href="#/commands">View Commands</a></div>
<div class="grid">${[['🛡️ Moderation','Warns, timeouts, bans, cases and full mod history.'],['🤖 Automod','Spam, links, caps, invites, mentions and banned words.'],['📈 Leveling','XP, rank cards, level roles and leaderboards.'],['👋 Welcome','Custom welcome and goodbye embeds with live preview.'],['🪙 Economy','Daily, work, slots, gamble and a coin leaderboard.'],['🎲 Fun','Trivia, polls, 8ball, ship and dozens more.']].map(([a,b])=>`<div class="card"><h3>${a}</h3><p>${b}</p></div>`).join('')}</div>`;
document.getElementById('h').prepend(logo('big'))}

async function commands(){app.innerHTML='<h1 style="font-size:38px">Commands</h1><input id="q" placeholder="Search commands…"><div class="chips" id="ch"></div><div class="card" style="padding:0" id="ls">Loading…</div>';
let list=[];try{list=await api('registry')}catch{}let cat='All',q='';const cats=['All',...new Set(list.map(c=>c.category))];
const draw=()=>{document.getElementById('ch').innerHTML=cats.map(c=>`<button class="chip ${c==cat?'on':''}" data-c="${c}">${c}</button>`).join('');
document.getElementById('ls').innerHTML=list.filter(c=>(cat=='All'||c.category==cat)&&(c.name+c.description).toLowerCase().includes(q)).map(c=>`<div class="cmd"><b>/${esc(c.name)}</b><span>${esc(c.description)}</span>${c.mod?'<i class="tag">MOD</i>':''}</div>`).join('')||'<div class="cmd"><span>No commands yet – start the bot with the Neon patch so it can publish its list.</span></div>';
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;draw()})};
document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();draw()};draw()}

async function dashboard(){let me;try{me=await api('me')}catch{app.innerHTML='<div class="hero"><h1>Log in to <span>Arcane</span></h1><p>Sign in with Yapper to manage your servers.</p><a class="btn" href="/api/login">Login with Yapper</a></div>';return}
let gs=await api('guilds');app.innerHTML=`<h1 style="font-size:34px">Hey, ${esc(me.name)} 👋</h1><div id="gl" class="grid"></div>`;
document.getElementById('gl').innerHTML=gs.map(g=>`<a class="card" href="#/dashboard/${g.server_id}"><h3>${esc(g.name)}</h3><p>${g.member_count??'?'} members</p></a>`).join('')||'<div class="card"><p>No servers yet. Add Arcane to a server you own, send any message, and it appears here within 10 minutes.</p></div>'}

async function guildPage(id){const {guild,config:c}=await api('guild/'+id);c.welcome||={};c.goodbye||={};c.automod||={};c.badWords||=[];
const chs=guild?.channels||[],opt=(l,v,ph)=>`<option value="">${ph}</option>`+l.map(x=>`<option value="${x.id}" ${x.id==v?'selected':''}>${esc(x.name)}</option>`).join('');
const tabs={General:()=>`${row('Mod log channel','Where moderation actions are posted','<select data-k="modlog">'+opt(chs,c.modlog,'Off')+'</select>')}${row('Suggestions channel','','<select data-k="suggest">'+opt(chs,c.suggest,'Off')+'</select>')}${row('Level-up channel','Empty = same channel','<select data-k="levelChannel">'+opt(chs,c.levelChannel,'Same channel')+'</select>')}${row('XP enabled','','<input type="checkbox" class="sw" data-k="xp" '+(c.xp!==false?'checked':'')+'>')}${row('XP multiplier','0.5 to 5','<input data-k="xpRate" type="number" step="0.5" min="0.5" max="5" value="'+(c.xpRate??1)+'">')}`,
Automod:()=>['spam','links','caps','invites','mentions'].map(k=>row(k[0].toUpperCase()+k.slice(1),'Auto-moderate '+k,`<input type="checkbox" class="sw" data-k="automod.${k}" ${c.automod[k]??(k=='spam'||k=='mentions')?'checked':''}>`)).join('')+row('Banned words','Comma separated – messages are auto-deleted','<textarea data-k="badWords" rows="3">'+esc(c.badWords.join(', '))+'</textarea>'),
Welcome:()=>`${row('Welcome channel','','<select data-k="welcome.channel">'+opt(chs,c.welcome.channel,'Off')+'</select>')}${row('Title','','<input data-k="welcome.title" value="'+esc(c.welcome.title)+'">')}${row('Message','Use {user} and {server}','<textarea data-k="welcome.message" rows="3">'+esc(c.welcome.message)+'</textarea>')}${row('Banner image URL','','<input data-k="welcome.image" value="'+esc(c.welcome.image)+'">')}${row('Color','Hex, e.g. #74c9f4','<input data-k="welcome.color" value="'+esc(c.welcome.color||'#74c9f4')+'">')}${row('Goodbye channel','','<select data-k="goodbye.channel">'+opt(chs,c.goodbye.channel,'Off')+'</select>')}${row('Goodbye message','','<textarea data-k="goodbye.message" rows="2">'+esc(c.goodbye.message)+'</textarea>')}<div class="prev" style="border-color:${esc(c.welcome.color||'#74c9f4')}"><b>${esc(c.welcome.title||'Welcome!')}</b><br>${esc((c.welcome.message||'Welcome {user} to {server}!').replace('{user}','@NewMember').replace('{server}',guild?.name||'Server'))}</div>`};
function row(t,s,i){return `<div class="row"><div><b>${t}</b><small>${s}</small></div><div>${i}</div></div>`}
let cur='General';const draw=()=>{app.innerHTML=`<a href="#/dashboard" style="color:var(--mut)">← Servers</a><h1 style="font-size:32px;margin:8px 0 20px">${esc(guild?.name)}</h1><div class="dash"><div class="side">${Object.keys(tabs).map(t=>`<button class="${t==cur?'on':''}" data-t="${t}">${t}</button>`).join('')}</div><div class="card" id="pn">${tabs[cur]()}<div style="margin-top:18px"><button class="btn" id="sv">Save changes</button></div></div></div>`;
document.querySelectorAll('.side button').forEach(b=>b.onclick=()=>{cur=b.dataset.t;draw()});
document.getElementById('sv').onclick=async()=>{const p={};document.querySelectorAll('[data-k]').forEach(e=>{const k=e.dataset.k.split('.');let v=e.type=='checkbox'?e.checked:e.value;if(e.dataset.k=='badWords')v=v.split(',').map(s=>s.trim()).filter(Boolean);if(e.dataset.k=='xpRate')v=Number(v);let o=p;k.slice(0,-1).forEach(x=>o=o[x]||={});o[k.at(-1)]=v});
const r=await put('guild/'+id,{config:p});Object.assign(c,r.config);toast()}};draw()}

async function route(){const [,p,id]=location.hash.split('/');document.querySelectorAll('nav a.l').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#/'+p));
try{if(p=='commands')await commands();else if(p=='dashboard'&&id)await guildPage(id);else if(p=='dashboard')await dashboard();else home()}catch{app.innerHTML='<div class="hero"><h1>Hmm.</h1><p>You may need to <a href="/api/login" style="color:var(--ac)">log in</a>, or you do not manage this server.</p></div>'}}
addEventListener('hashchange',route);route();
</script></body></html>
